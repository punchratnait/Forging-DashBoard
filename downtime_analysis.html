<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Downtime Reasons Analysis</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --navy: #0f3557; --navy-2: #164a74; --accent: #2f8fd8; --accent-2: #5cb3e8;
    --green: #2fae6b; --amber: #e0a52f; --red: #d5493b;
    --bg: #eef2f6; --panel: #ffffff; --line: #e2e8ef; --ink: #1c2b3a; --ink-dim: #64748b;
    --shadow: 0 4px 18px rgba(15,53,87,0.08), 0 1px 3px rgba(15,53,87,0.06);
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--ink);
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1720; --panel:#16202b; --line:#243040; --ink:#e8edf3; --ink-dim:#8a97a8;
      --shadow: 0 4px 18px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.25);
    }
  }
  .topbar { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 22px 28px; }
  .topbar-row { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .topbar-eyebrow { font-size: 12px; letter-spacing: 0.08em; opacity: 0.75; margin-bottom: 4px; }
  .topbar h1 { font-size: 22px; font-weight: 700; }
  .logout-btn { background: rgba(255,255,255,0.12); color:#fff; border:none; padding:7px 14px; border-radius:6px; font-size:12px; font-weight:700; cursor:pointer; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px; }
  .note { background: rgba(47,143,216,0.08); border: 1px solid rgba(47,143,216,0.25); border-radius: 8px; padding: 12px 16px; font-size: 12.5px; color: var(--ink-dim); margin-bottom: 20px; }
  .note b { color: var(--ink); }
  .filter-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .filter-bar select, .filter-bar input { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-size: 12.5px; box-shadow: var(--shadow); }
  .download-btn { padding: 8px 16px; border-radius: 6px; border: none; background: var(--accent); color: #fff; font-weight: 700; font-size: 12.5px; cursor: pointer; margin-left: auto; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
  @media (max-width: 900px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .kpi-row { grid-template-columns: 1fr; } }
  .kpi-card { background: var(--panel); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); border-top: 3px solid var(--accent); }
  .kpi-value { font-size: 22px; font-weight: 800; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .kpi-value { color: var(--accent-2); } }
  .kpi-label { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }
  .grid-2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border-radius: 10px; padding: 18px; box-shadow: var(--shadow); }
  .panel h3 { font-size: 14.5px; font-weight: 700; margin-bottom: 14px; }
  .chart-box { position: relative; height: 300px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  th { text-align: left; font-size: 11px; letter-spacing: 0.04em; color: var(--ink-dim); padding: 8px 10px; border-bottom: 1px solid var(--line); text-transform: uppercase; }
  td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .login-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card { background: var(--panel); border-radius: 12px; padding: 32px; box-shadow: var(--shadow); max-width: 360px; width:100%; }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; color: var(--navy); }
  @media (prefers-color-scheme: dark) { .login-card h1 { color: var(--accent-2); } }
  .login-card p { font-size: 12.5px; color: var(--ink-dim); margin-bottom: 20px; }
  .login-field { margin-bottom: 14px; }
  .login-field label { display:block; font-size:11.5px; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; }
  .login-field input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:14px; }
  .login-btn { width:100%; padding:11px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px; }
  .login-err { color: var(--red); font-size:12.5px; margin-top:10px; }
  .loading-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:13px; }
  .err-banner { background:#fde8e6; border:1px solid #d5493b; color:#8a2f24; border-radius:8px; padding:14px 18px; margin-bottom:16px; font-size:13px; font-family:monospace; white-space:pre-wrap; }
  @media (max-width: 640px) {
    .topbar { padding: 16px 16px; } .topbar h1 { font-size: 18px; } .wrap { padding: 16px; }
    .kpi-value { font-size: 19px; } .kpi-card { padding: 14px; } .panel { padding: 14px; } .panel h3 { font-size: 13px; }
    .chart-box { height: 230px; } table { min-width: 480px; font-size: 12px; } th, td { padding: 7px 8px; }
  }
</style>
</head>
<body>
<div id="app"><div class="loading-wrap">Loading…</div></div>

<script>
if(typeof Chart === 'undefined' || typeof window.supabase === 'undefined'){
  document.getElementById('app').innerHTML = '<div class="loading-wrap">A required script failed to load from the CDN. Please refresh.</div>';
  throw new Error('Required library not loaded');
}

const SUPABASE_URL = 'https://dneaugurejuqcubfbwij.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuZWF1Z3VyZWp1cWN1YmZid2lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNDIzMDQsImV4cCI6MjEwMTcxODMwNH0.SWQN85VkfjALNMiQPAVKfZLG1YRNo7ovasd4SGuTpxM';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

let DB = { users:[], machines:[], reasons:[], shifts:[], entries:[] };
let SESSION = null;

async function loadAll(){
  const { data, error } = await supabaseClient.from('kv_store').select('key,value');
  if(error){ throw new Error('kv_store load failed: ' + error.message); }
  const map = {};
  (data||[]).forEach(row=>{ map[row.key] = row.value; });
  DB.users = map['prf_users'] || [];
  DB.machines = map['prf_machines'] || [];
  DB.reasons = map['prf_downtime_reasons'] || [];
  DB.shifts = map['prf_shifts'] || [];

  const { data: entryRows, error: entryErr } = await supabaseClient.from('prf_entries_v2').select('*');
  if(entryErr){ throw new Error('entries load failed: ' + entryErr.message); }
  DB.entries = (entryRows||[]).map(row=>({
    id: row.id, date: row.date, shiftId: row.shift_id, machineId: row.machine_id,
    downtimeBlocks: row.downtime_blocks || [], operatorName: row.operator_name
  }));
}

function byId(arr,id){ return arr.find(x=>x.id===id); }
function nameOf(arr,id){ const o=byId(arr,id); return o ? o.name : '—'; }
function machineLabel(id){ const m=byId(DB.machines,id); if(!m) return '—'; return m.machineCode || m.name; }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysAgoStr(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function monthStartStr(){ return new Date().toISOString().slice(0,8)+'01'; }
function inRange(d,s,e){ return d>=s && d<=e; }

// Flatten every entry's downtimeBlocks into individual event rows — this page is about
// down time events specifically, not production entries, so each block is its own row.
function allDowntimeEvents(){
  const events = [];
  DB.entries.forEach(e=>{
    (e.downtimeBlocks||[]).forEach(b=>{
      const minutes = Number(b.minutes)||0;
      if(minutes <= 0) return;
      events.push({
        date: e.date, machine: machineLabel(e.machineId), shift: nameOf(DB.shifts, e.shiftId),
        reasonId: b.reasonId, reason: b.reasonId ? nameOf(DB.reasons, b.reasonId) : 'Unspecified',
        from: b.from||'', to: b.to||'', minutes, operator: e.operatorName||'—', remark: b.remark||''
      });
    });
  });
  return events;
}

function renderLogin(err){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Downtime Reasons Analysis</h1>
        <p>For Maintenance / Tool Room accounts, and Admin / Head / Management for oversight.</p>
        <form id="loginForm">
          <div class="login-field"><label>User ID</label><input type="text" id="loginId" autocomplete="username" required></div>
          <div class="login-field"><label>Password</label><input type="password" id="loginPw" autocomplete="current-password" required></div>
          <button class="login-btn" type="submit">Sign In</button>
        </form>
        ${err ? `<div class="login-err">${err}</div>` : ''}
      </div>
    </div>`;
  document.getElementById('loginForm').onsubmit = async (ev)=>{
    ev.preventDefault();
    const id = document.getElementById('loginId').value.trim();
    const pw = document.getElementById('loginPw').value;
    const user = DB.users.find(u=>u.id===id || u.name===id);
    if(!user){ renderLogin('Account not found.'); return; }
    const canAccess = ['admin','head','management'].includes(user.role) || (user.role==='maintenance' && user.canAccessDowntimePage===true);
    if(!canAccess){ renderLogin('This account does not have access to Downtime Analysis. Contact your Admin.'); return; }
    const hash = await sha256(pw);
    if(hash !== user.passwordHash){ renderLogin('Incorrect password.'); return; }
    SESSION = user;
    sessionStorage.setItem('prf_downtime_session', user.id);
    renderApp();
  };
}

let currentReason = '';
let currentMachine = '';
let currentRangeMode = 'mtd';
let currentSpecificDate = todayStr();
let currentCustomFrom = daysAgoStr(7);
let currentCustomTo = todayStr();
const charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }
function mkChart(id, config){ const el=document.getElementById(id); if(!el) return; destroyChart(id); charts[id] = new Chart(el, config); return charts[id]; }
function numVal(n){ return Math.round((Number(n)||0)*10)/10; }
function fmt1(n){ return (Math.round((Number(n)||0)*10)/10).toLocaleString(); }

function currentDateRange(){
  const end = todayStr();
  if(currentRangeMode==='mtd') return { start: monthStartStr(), end };
  if(currentRangeMode==='30d') return { start: daysAgoStr(30), end };
  if(currentRangeMode==='14d') return { start: daysAgoStr(14), end };
  if(currentRangeMode==='specific') return { start: currentSpecificDate, end: currentSpecificDate };
  if(currentRangeMode==='custom'){
    // Guard against a From date accidentally set after To — swap rather than
    // silently return an empty/invalid range.
    return currentCustomFrom <= currentCustomTo
      ? { start: currentCustomFrom, end: currentCustomTo }
      : { start: currentCustomTo, end: currentCustomFrom };
  }
  return { start: daysAgoStr(14), end };
}
function filteredEvents(){
  const {start,end} = currentDateRange();
  return allDowntimeEvents().filter(e=>{
    if(!inRange(e.date, start, end)) return false;
    if(currentReason && e.reasonId !== currentReason) return false;
    if(currentMachine && e.machine !== currentMachine) return false;
    return true;
  });
}

function renderMain(){
  const events = filteredEvents();
  const totalMin = events.reduce((s,e)=>s+e.minutes,0);
  const totalEvents = events.length;
  const avgMin = totalEvents>0 ? totalMin/totalEvents : 0;
  const byReason = {};
  events.forEach(e=>{ if(!byReason[e.reason]) byReason[e.reason]={count:0,min:0}; byReason[e.reason].count++; byReason[e.reason].min+=e.minutes; });
  const reasonRows = Object.entries(byReason).map(([name,v])=>({name, ...v, avg: v.min/v.count})).sort((a,b)=>b.min-a.min);
  const topReason = reasonRows.length ? reasonRows[0].name : '—';

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card"><div class="kpi-value">${fmt1(totalMin)} min</div><div class="kpi-label">Total Down Time</div></div>
    <div class="kpi-card"><div class="kpi-value">${totalEvents}</div><div class="kpi-label">Total Events Logged</div></div>
    <div class="kpi-card"><div class="kpi-value" style="font-size:16px;">${topReason}</div><div class="kpi-label">Most Frequent Reason</div></div>
    <div class="kpi-card"><div class="kpi-value">${fmt1(avgMin)} min</div><div class="kpi-label">Avg Duration / Event</div></div>
  `;

  const top6 = reasonRows.slice(0,6);
  const total = top6.reduce((s,r)=>s+r.min,0);
  let running = 0;
  const cumPct = top6.map(r=>{ running += r.min; return numVal(total>0 ? running/total*100 : 0); });
  mkChart('c_pareto', {
    data: { labels: top6.map(r=>r.name), datasets: [
      { type:'bar', label:'Minutes', data:top6.map(r=>numVal(r.min)), backgroundColor:'#2f8fd8', borderRadius:4, yAxisID:'y' },
      { type:'line', label:'Cumulative %', data:cumPct, borderColor:'#d5493b', backgroundColor:'#d5493b', tension:0.2, pointRadius:4, yAxisID:'y1' }
    ]},
    options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom'}},
      scales:{ x:{grid:{display:false}, ticks:{font:{size:10.5}}}, y:{grid:{color:'rgba(100,116,139,0.12)'}, title:{display:true, text:'Minutes'}}, y1:{position:'right', min:0, max:100, grid:{display:false}, ticks:{callback:v=>v+'%'}} } }
  });

  document.getElementById('reasonSummaryBody').innerHTML = reasonRows.length ? reasonRows.map(r=>`
    <tr><td>${r.name}</td><td>${r.count}</td><td>${fmt1(r.min)}</td><td>${fmt1(r.avg)}</td></tr>`).join('') : `<tr><td colspan="4">No down time logged for this range.</td></tr>`;

  const sortedEvents = [...events].sort((a,b)=> b.date.localeCompare(a.date) || b.minutes-a.minutes);
  document.getElementById('eventLogBody').innerHTML = sortedEvents.length ? sortedEvents.map(e=>`
    <tr>
      <td style="font-family:monospace;">${e.date}</td>
      <td>${e.machine}</td>
      <td>${e.shift}</td>
      <td>${e.reason}</td>
      <td style="font-family:monospace;">${e.from}</td>
      <td style="font-family:monospace;">${e.to}</td>
      <td style="font-family:monospace;">${e.minutes}</td>
      <td>${e.operator}</td>
      <td style="color:var(--ink-dim); font-size:12px;">${e.remark||'—'}</td>
    </tr>`).join('') : `<tr><td colspan="9">No down time logged for this range.</td></tr>`;
}

function downloadCsv(){
  const events = [...filteredEvents()].sort((a,b)=> b.date.localeCompare(a.date));
  const header = ['Date','Machine','Shift','Reason','From','To','Minutes','Operator','Remark'];
  const rows = events.map(e=>[e.date,e.machine,e.shift,e.reason,e.from,e.to,e.minutes,e.operator,e.remark].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'downtime-events-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderApp(){
  const machineNames = [...new Set(DB.machines.map(m=>m.machineCode||m.name))].sort();
  document.getElementById('app').innerHTML = `
    <div class="topbar">
      <div class="topbar-row">
        <div>
          <div class="topbar-eyebrow">MAINTENANCE &amp; TOOL ROOM · DOWNTIME ANALYSIS</div>
          <h1>Downtime Reasons</h1>
        </div>
        <button class="logout-btn" id="logoutBtn">Sign Out (${SESSION.name})</button>
      </div>
    </div>
    <div class="wrap">
      <div class="filter-bar">
        <select id="reasonFilter"><option value="">All Reasons</option>${DB.reasons.map(r=>`<option value="${r.id}">${r.name}</option>`).join('')}</select>
        <select id="machineFilter"><option value="">All Machines</option>${machineNames.map(m=>`<option value="${m}">${m}</option>`).join('')}</select>
        <select id="rangeFilter"><option value="mtd">Month to Date</option><option value="30d">Last 30 Days</option><option value="14d">Last 14 Days</option><option value="specific">Specific Date</option><option value="custom">Custom Range</option></select>
        <input type="date" id="specificDateInput" style="display:none;" value="${todayStr()}">
        <input type="date" id="customFromInput" style="display:none;" value="${daysAgoStr(7)}">
        <span id="customToLabel" style="display:none; color:var(--ink-dim); font-size:12.5px;">to</span>
        <input type="date" id="customToInput" style="display:none;" value="${todayStr()}">
        <button class="download-btn" id="downloadBtn">⬇ Download CSV</button>
      </div>
      <div class="kpi-row" id="kpi-row"></div>
      <div class="grid-2">
        <div class="panel"><h3>Down Time by Reason — Total Minutes (Pareto)</h3><div class="chart-box"><canvas id="c_pareto"></canvas></div></div>
        <div class="panel"><h3>Reason Summary</h3><div class="table-scroll"><table><thead><tr><th>Reason</th><th>Events</th><th>Total Min</th><th>Avg Min</th></tr></thead><tbody id="reasonSummaryBody"></tbody></table></div></div>
      </div>
      <div class="panel">
        <h3>Down Time Event Log</h3>
        <div class="table-scroll"><table><thead><tr><th>Date</th><th>Machine</th><th>Shift</th><th>Reason</th><th>From</th><th>To</th><th>Minutes</th><th>Operator</th><th>Remark</th></tr></thead><tbody id="eventLogBody"></tbody></table></div>
      </div>
    </div>
  `;
  document.getElementById('logoutBtn').onclick = ()=>{ SESSION=null; sessionStorage.removeItem('prf_downtime_session'); renderLogin(); };
  document.getElementById('reasonFilter').onchange = (ev)=>{ currentReason = ev.target.value; renderMain(); };
  document.getElementById('machineFilter').onchange = (ev)=>{ currentMachine = ev.target.value; renderMain(); };
  const specificDateInput = document.getElementById('specificDateInput');
  const customFromInput = document.getElementById('customFromInput');
  const customToLabel = document.getElementById('customToLabel');
  const customToInput = document.getElementById('customToInput');
  const updateRangeInputVisibility = ()=>{
    specificDateInput.style.display = currentRangeMode==='specific' ? '' : 'none';
    customFromInput.style.display = currentRangeMode==='custom' ? '' : 'none';
    customToLabel.style.display = currentRangeMode==='custom' ? '' : 'none';
    customToInput.style.display = currentRangeMode==='custom' ? '' : 'none';
  };
  document.getElementById('rangeFilter').onchange = (ev)=>{
    currentRangeMode = ev.target.value;
    updateRangeInputVisibility();
    renderMain();
  };
  specificDateInput.onchange = (ev)=>{ currentSpecificDate = ev.target.value; renderMain(); };
  customFromInput.onchange = (ev)=>{ currentCustomFrom = ev.target.value; renderMain(); };
  customToInput.onchange = (ev)=>{ currentCustomTo = ev.target.value; renderMain(); };
  updateRangeInputVisibility();
  document.getElementById('downloadBtn').onclick = downloadCsv;
  try { renderMain(); } catch(err) {
    const wrapEl = document.querySelector('.wrap');
    const banner = document.createElement('div');
    banner.className = 'err-banner';
    banner.textContent = 'Render error: ' + err.message;
    wrapEl.prepend(banner);
    console.error(err);
  }
}

(async function boot(){
  try {
    await loadAll();
  } catch(err) {
    document.getElementById('app').innerHTML = '<div class="loading-wrap">Failed to load data: ' + err.message + '</div>';
    return;
  }
  const urlUid = new URLSearchParams(window.location.search).get('uid');
  if(urlUid){
    const user = DB.users.find(u=>u.id===urlUid);
    const canAccess = user && (['admin','head','management'].includes(user.role) || (user.role==='maintenance' && user.canAccessDowntimePage===true));
    if(canAccess){
      SESSION = user;
      sessionStorage.setItem('prf_downtime_session', user.id);
      history.replaceState(null, '', window.location.pathname);
      renderApp();
      return;
    }
  }
  const savedId = sessionStorage.getItem('prf_downtime_session');
  if(savedId){
    const user = DB.users.find(u=>u.id===savedId);
    const canAccess = user && (['admin','head','management'].includes(user.role) || (user.role==='maintenance' && user.canAccessDowntimePage===true));
    if(canAccess){ SESSION = user; renderApp(); return; }
  }
  renderLogin();
})();
</script>
</body>
</html>
